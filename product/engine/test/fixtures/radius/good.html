<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plans</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body { margin: 0; padding: var(--ds-space-inset-xl) var(--ds-layout-margin); }
    .card { border-radius: var(--ds-shape-container); background: var(--ds-color-bg-surface); border: var(--ds-border-width-line) solid var(--ds-color-border-subtle); max-width: 22.5rem; }
    .card .flush { background: var(--ds-color-bg-brand-subtle); padding: var(--ds-space-inset-md); border-start-start-radius: var(--ds-shape-container); border-start-end-radius: var(--ds-shape-container); }
    .card .panel { border-radius: max(0px, var(--ds-shape-container) - var(--ds-space-inset-xs)); background: var(--ds-color-bg-surface-sunken); padding: var(--ds-space-inset-sm); margin: var(--ds-space-stack-xs) var(--ds-space-inline-xs); }
    .btn { border-radius: var(--ds-shape-control); padding: var(--ds-space-inset-xs) var(--ds-space-inset-md); min-height: var(--ds-size-control-height); border: var(--ds-border-width-control) solid var(--ds-color-border-strong); background: var(--ds-color-bg-surface); color: var(--ds-color-fg-default); }
    .btn:hover { background: var(--ds-color-bg-surface-hover); }
    .menu { border-radius: var(--ds-shape-container); background: var(--ds-color-bg-surface); padding: var(--ds-space-inset-xs); margin: 0; list-style: none; }
    .menu a { display: block; padding: var(--ds-space-inset-sm); border-radius: max(0px, var(--ds-shape-container) - var(--ds-space-inset-xs)); }
    .badge { border-radius: var(--ds-shape-pill); padding: var(--ds-space-inset-xs) var(--ds-space-inset-sm); background: var(--ds-color-bg-brand-subtle); white-space: nowrap; }
    .chip { position: relative; border-radius: var(--ds-shape-control); }
    .chip:focus-visible { outline: none; }
    .chip:focus-visible::after { content: ""; position: absolute; inset: calc(-1 * var(--ds-focus-ring-offset)); box-shadow: 0 0 0 var(--ds-focus-ring-width) var(--ds-focus-ring-color); border-radius: var(--ds-shape-control-focus); }
    input[type="checkbox"] { border-radius: var(--ds-shape-mark); }
    .avatar { border-radius: var(--ds-shape-pill); }
  </style>
</head>
<body>
  <section class="card">
    <div class="flush">Pro plan</div>
    <div class="panel">Billed yearly <a href="#terms">terms</a></div>
  </section>
  <div class="ds-join" role="group" aria-label="Billing period">
    <button class="btn">Monthly</button><button class="btn">Yearly</button>
  </div>
  <ul class="menu"><li><a href="#a">Account</a></li></ul>
  <span class="badge">New</span>
  <label><input type="checkbox"> I agree</label>
</body>
</html>
