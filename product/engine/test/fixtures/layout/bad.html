<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Projects</title>
  <style>
    :root { --ds-layout-margin: 20px; }
    body { overflow-x: hidden; }
    .container { width: 1200px; margin: 0 auto; padding: 0 24px; }
    .topbar { position: sticky; top: 0; height: 72px; }
    .filters { position: sticky; top: 0; }
    html { scroll-padding-top: 80px; }
    .hero { width: 100vw; }
    p { max-width: 640px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
    .columns { display: grid; grid-template-columns: 240px 240px 240px; }
    .sidebar-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); }
    .sidebar { order: -1; }
    @media (max-width: 768px) { .cards { grid-template-columns: minmax(0, 1fr); } }
    @media (min-width: 1024px) { .container { padding: 0 40px; } }
    @media (min-width: 50em) { .gallery { gap: var(--ds-space-inline-lg); } }
  </style>
</head>
<body>
  <div class="ds-shell">
    <main data-shell="main" class="container">
      <div class="data" style="overflow-x: auto"><table><tr><td>Atlas</td></tr></table></div>
    </main>
    <nav data-shell="nav" aria-label="Sections"></nav>
    <aside data-shell="details"></aside>
  </div>
</body>
</html>
